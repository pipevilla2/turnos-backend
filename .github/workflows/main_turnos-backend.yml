# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - turnos-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish src/Turnos.Api/Turnos.Api.csproj -c Release -o "${{ runner.temp }}/myapp"

      - name: Verify published runtime files
        shell: pwsh
        run: |
          $required = @(
            "Turnos.Api.dll",
            "System.IdentityModel.Tokens.Jwt.dll",
            "Turnos.Api.deps.json"
          )
          $missing = $required | Where-Object {
            -not (Test-Path (Join-Path "${{ runner.temp }}/myapp" $_))
          }
          if ($missing) {
            throw "Missing published files: $($missing -join ', ')"
          }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_959F0A46ACFE4CA0900CA47B29486513 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CC35DAFE29FA46E98F1FA036ACE3CEC2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6831DD28419D444BA71702CB94F8E64C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'turnos-backend'
          slot-name: 'Production'
          package: .
          